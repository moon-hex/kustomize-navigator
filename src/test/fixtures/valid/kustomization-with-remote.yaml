apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - https://raw.gitlab.com/example/project.git/tags/?ref=v0.0.1
  - oci://ghcr.io/example/org/kustomize-manifests

patches:
  - https://raw.gitlab.com/example/project.git/tags/?ref=v0.0.1
  - path: https://example.com/remote-patch.yaml
    target:
      kind: Deployment
      name: demo

generators:
  - https://example.com/generator.yaml
